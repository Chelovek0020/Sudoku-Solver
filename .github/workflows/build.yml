name: Build and Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install UPX (cross-platform fallback)
        shell: bash
        run: |
          set -e
          if command -v upx >/dev/null 2>&1; then
            upx --version
            exit 0
          fi

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo apt-get update || true
            sudo apt-get install -y upx upx-ucl || true
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            brew update || true
            brew install upx || true
          fi

          if command -v upx >/dev/null 2>&1; then
            upx --version
            exit 0
          fi

          # Fallback: official release binaries
          UPX_VER="4.2.4"
          mkdir -p .tools
          cd .tools

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            curl -L -o upx.zip "https://github.com/upx/upx/releases/download/v${UPX_VER}/upx-${UPX_VER}-win64.zip"
            python -c "import zipfile; zipfile.ZipFile('upx.zip').extractall('.')"
            echo "$PWD/upx-${UPX_VER}-win64" >> "$GITHUB_PATH"
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            curl -L -o upx.tar.xz "https://github.com/upx/upx/releases/download/v${UPX_VER}/upx-${UPX_VER}-amd64_linux.tar.xz"
            tar -xf upx.tar.xz
            echo "$PWD/upx-${UPX_VER}-amd64_linux" >> "$GITHUB_PATH"
          else
            curl -L -o upx.tar.xz "https://github.com/upx/upx/releases/download/v${UPX_VER}/upx-${UPX_VER}-amd64_macos.tar.xz"
            tar -xf upx.tar.xz
            echo "$PWD/upx-${UPX_VER}-amd64_macos" >> "$GITHUB_PATH"
          fi

      - name: Verify UPX
        shell: bash
        run: |
          if ! command -v upx >/dev/null 2>&1; then
            echo "UPX is not available; beta-compressed build will fallback to non-compressed."
            exit 0
          fi
          upx --version

      - name: Build A (onefile embedded)
        shell: bash
        run: |
          ICON_ARGS=""
          DATA_ARGS=""
          if [[ -f assets/app.ico ]]; then
            ICON_ARGS="--icon assets/app.ico"
            if [[ "${{ runner.os }}" != "Windows" ]]; then
              DATA_ARGS="--add-data assets/app.ico:assets"
            else
              DATA_ARGS="--add-data assets/app.ico;assets"
            fi
          fi
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name SudokuSolver-embedded $ICON_ARGS $DATA_ARGS src/main.py

      - name: Build B (thin, python required)
        shell: bash
        run: |
          mkdir -p dist/thin
          cp -r src dist/thin/src
          cp requirements.txt dist/thin/requirements.txt
          cat > dist/thin/run.sh <<'EOF'
          #!/usr/bin/env bash
          python src/main.py
          EOF
          chmod +x dist/thin/run.sh
          cat > dist/thin/run.bat <<'EOF'
          @echo off
          python src\main.py
          EOF

      - name: Build C (BETA compressed onefile, UPX)
        shell: bash
        run: |
          ICON_ARGS=""
          DATA_ARGS=""
          if [[ -f assets/app.ico ]]; then
            ICON_ARGS="--icon assets/app.ico"
            if [[ "${{ runner.os }}" != "Windows" ]]; then
              DATA_ARGS="--add-data assets/app.ico:assets"
            else
              DATA_ARGS="--add-data assets/app.ico;assets"
            fi
          fi

          pyinstaller --noconfirm --clean --onefile --windowed \
            --name SudokuSolver-beta-compressed $ICON_ARGS $DATA_ARGS src/main.py

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            TARGET="dist/SudokuSolver-beta-compressed.exe"
          else
            TARGET="dist/SudokuSolver-beta-compressed"
          fi

          BEFORE=$(wc -c < "$TARGET")
          if command -v upx >/dev/null 2>&1; then
            upx --best --lzma "$TARGET" || true
          fi
          AFTER=$(wc -c < "$TARGET")
          echo "Size before UPX: $BEFORE"
          echo "Size after  UPX: $AFTER"

      - name: Package outputs
        shell: bash
        run: |
          mkdir -p out
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp dist/SudokuSolver-embedded.exe out/SudokuSolver-embedded-windows.exe
            cp dist/SudokuSolver-beta-compressed.exe out/SudokuSolver-beta-compressed-windows.exe
            (cd dist && powershell -Command "Compress-Archive -Path thin/* -DestinationPath ../out/SudokuSolver-thin-windows.zip")
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            cp dist/SudokuSolver-embedded out/SudokuSolver-embedded-linux
            cp dist/SudokuSolver-beta-compressed out/SudokuSolver-beta-compressed-linux
            tar -czf out/SudokuSolver-thin-linux.tar.gz -C dist thin
          else
            cp dist/SudokuSolver-embedded out/SudokuSolver-embedded-macos
            cp dist/SudokuSolver-beta-compressed out/SudokuSolver-beta-compressed-macos
            tar -czf out/SudokuSolver-thin-macos.tar.gz -C dist thin
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: SudokuSolver-${{ runner.os }}
          path: out/*

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          draft: false
          prerelease: false
