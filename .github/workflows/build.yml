name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install UPX (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Install UPX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install upx -y

      - name: Install UPX (macOS)
        if: runner.os == 'macOS'
        run: brew install upx

      - name: Build A (onefile embedded)
        shell: bash
        run: |
          ICON_ARGS=""
          DATA_ARGS=""
          if [[ -f assets/app.ico ]]; then
            ICON_ARGS="--icon assets/app.ico"
            if [[ "${{ runner.os }}" != "Windows" ]]; then
              DATA_ARGS="--add-data assets/app.ico:assets"
            else
              DATA_ARGS="--add-data assets/app.ico;assets"
            fi
          fi
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name SudokuSolver-embedded $ICON_ARGS $DATA_ARGS src/main.py

      - name: Build B (thin, python required)
        shell: bash
        run: |
          mkdir -p dist/thin
          cp -r src dist/thin/src
          cp requirements.txt dist/thin/requirements.txt
          cat > dist/thin/run.sh <<'EOF'
          #!/usr/bin/env bash
          python src/main.py
          EOF
          chmod +x dist/thin/run.sh
          cat > dist/thin/run.bat <<'EOF'
          @echo off
          python src\main.py
          EOF

      - name: Build C (BETA compressed onefile, UPX)
        shell: bash
        run: |
          ICON_ARGS=""
          DATA_ARGS=""
          if [[ -f assets/app.ico ]]; then
            ICON_ARGS="--icon assets/app.ico"
            if [[ "${{ runner.os }}" != "Windows" ]]; then
              DATA_ARGS="--add-data assets/app.ico:assets"
            else
              DATA_ARGS="--add-data assets/app.ico;assets"
            fi
          fi
          UPX_ARGS=""
          if command -v upx >/dev/null 2>&1; then
            UPX_ARGS="--upx-dir $(dirname $(command -v upx))"
          fi
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name SudokuSolver-beta-compressed $UPX_ARGS $ICON_ARGS $DATA_ARGS src/main.py

      - name: Package outputs
        shell: bash
        run: |
          mkdir -p out
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp dist/SudokuSolver-embedded.exe out/SudokuSolver-embedded-windows.exe
            cp dist/SudokuSolver-beta-compressed.exe out/SudokuSolver-beta-compressed-windows.exe
            (cd dist && powershell -Command "Compress-Archive -Path thin/* -DestinationPath ../out/SudokuSolver-thin-windows.zip")
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            cp dist/SudokuSolver-embedded out/SudokuSolver-embedded-linux
            cp dist/SudokuSolver-beta-compressed out/SudokuSolver-beta-compressed-linux
            tar -czf out/SudokuSolver-thin-linux.tar.gz -C dist thin
          else
            cp dist/SudokuSolver-embedded out/SudokuSolver-embedded-macos
            cp dist/SudokuSolver-beta-compressed out/SudokuSolver-beta-compressed-macos
            tar -czf out/SudokuSolver-thin-macos.tar.gz -C dist thin
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: SudokuSolver-${{ runner.os }}
          path: out/*

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          draft: false
          prerelease: false
